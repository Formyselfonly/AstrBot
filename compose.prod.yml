# Full stack: AstrBot engine + fish-api + fish-console (nginx).
# Usage: cp deploy/.env.example deploy/.env && docker compose --env-file deploy/.env -f compose.prod.yml up -d --build

name: dafeiyu

services:
  astrbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: dafeiyu-astrbot:local
    container_name: dafeiyu-astrbot
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - astrbot_data:/AstrBot/data
    ports:
      - "127.0.0.1:6185:6185"
    networks:
      - dafeiyu

  fish-api:
    build:
      context: ./fish-api
      dockerfile: Dockerfile
    image: dafeiyu-fish-api:local
    container_name: dafeiyu-fish-api
    restart: unless-stopped
    env_file:
      - ./deploy/.env
    environment:
      FISH_ASTRBOT_BASE_URL: http://astrbot:6185
      FISH_ASTRBOT_DATABASE_URL: sqlite:////AstrBot/data/data_v4.db
      FISH_DATABASE_URL: sqlite:///./data/fish.db
    volumes:
      - fish_api_data:/app/data
      - astrbot_data:/AstrBot/data:ro
    depends_on:
      astrbot:
        condition: service_started
    networks:
      - dafeiyu

  web:
    build:
      context: ./fish-console
      dockerfile: Dockerfile
      args:
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-大肥鱼鱼咖}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@example.com}
        VITE_MIN_TOPUP_YUAN: ${VITE_MIN_TOPUP_YUAN:-1}
        VITE_FEED_PLAN_YUAN_1: ${VITE_FEED_PLAN_YUAN_1:-2}
        VITE_FEED_PLAN_YUAN_2: ${VITE_FEED_PLAN_YUAN_2:-5}
        VITE_FEED_PLAN_YUAN_3: ${VITE_FEED_PLAN_YUAN_3:-10}
        VITE_FEED_PLAN_NAME_1: ${VITE_FEED_PLAN_NAME_1:-唔饿啦}
        VITE_FEED_PLAN_NAME_2: ${VITE_FEED_PLAN_NAME_2:-贴贴罐}
        VITE_FEED_PLAN_NAME_3: ${VITE_FEED_PLAN_NAME_3:-饱饱桶}
        VITE_ALIPAY_QR_URL: ${VITE_ALIPAY_QR_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: dafeiyu-fish-console:local
    container_name: dafeiyu-web
    restart: unless-stopped
    environment:
      FISH_SITE_HOST: ${FISH_SITE_HOST:?set FISH_SITE_HOST e.g. fish.kerryzhengai.com}
      FISH_EXTRA_SERVER_NAMES: ${FISH_EXTRA_SERVER_NAMES:-}
    ports:
      - "${FISH_BIND_ADDRESS:-127.0.0.1}:${FISH_HTTP_PORT:-8080}:80"
    depends_on:
      fish-api:
        condition: service_healthy
    networks:
      - dafeiyu

  # Optional: external ops UI via Tunnel — docker compose --profile console-proxy …
  console-proxy:
    profiles:
      - console-proxy
    build:
      context: ./deploy/console-proxy
      dockerfile: Dockerfile
    image: dafeiyu-console-proxy:local
    container_name: dafeiyu-console-proxy
    restart: unless-stopped
    environment:
      CONSOLE_PROXY_USER: ${CONSOLE_PROXY_USER:-kerryzheng}
      CONSOLE_PROXY_PASSWORD: ${CONSOLE_PROXY_PASSWORD:?set CONSOLE_PROXY_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${CONSOLE_PROXY_PORT:-6186}:80"
    depends_on:
      astrbot:
        condition: service_started
    networks:
      - dafeiyu

volumes:
  astrbot_data:
  fish_api_data:

networks:
  dafeiyu:
    driver: bridge
